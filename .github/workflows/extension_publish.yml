name: Publish extension

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extensions
        run: npm run build

      - name: Read manifest version
        id: get_version
        run: |
          VERSION=$(jq -r .version dist/chrome/manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if tag exists
        id: tag_check
        run: |
          TAG_NAME="v${{ env.VERSION }}"
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version $TAG_NAME detected. Proceeding with release."
          fi

      - name: Zip extensions
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          (cd dist/chrome && zip -r ../../kosteam-chrome-v${{ env.VERSION }}.zip .)
          (cd dist/firefox && zip -r ../../kosteam-firefox-v${{ env.VERSION }}.zip .)
          sha256sum kosteam-chrome-v${{ env.VERSION }}.zip kosteam-firefox-v${{ env.VERSION }}.zip > SHA256SUMS

      - name: Create GitHub release and upload zips
        if: steps.tag_check.outputs.exists == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ env.VERSION }}
          commit: ${{ github.sha }}
          artifactErrorsFailBuild: true
          artifacts: "kosteam-chrome-v${{ env.VERSION }}.zip,kosteam-firefox-v${{ env.VERSION }}.zip,SHA256SUMS"
          immutableCreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
