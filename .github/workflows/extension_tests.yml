name: Extension regression tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'package*.json', 'rollup.config.js', '.github/workflows/extension_tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run test:matrix
      - run: npx --no-install web-ext lint --source-dir dist/firefox
