name: Extension regression tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'scrapers/**', 'requirements-scrape.txt', 'package*.json', 'rollup.config.js', '.github/workflows/extension_tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - run: python -m pip install --require-hashes -r requirements-scrape.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:matrix
      - run: npx --no-install web-ext lint --source-dir dist/firefox
